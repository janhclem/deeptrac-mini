# Bickley Jet Configuration for Stratospheric Transport with Emulation
# Domain: 20000km x 10000km

[DOMAIN]
lx = 20000000
ly = 10000000

[NUMERICS]
nump = 20000

[TIME]
tmax = 2592000
dt = 1800
dt_mix = 86400
dt_plot = 86400

[PHYSICS]
beta = 1.0
dim = 2

[MIXING]
dmix = 11574074.074074075
ddiff0 = 0.0
ddiff1 = 0.0
# Critical stretching rate for steering mixing (1/s)
lbd_c = 1e-08
# Smoothness parameter for steering mixing tanh trigger
w = 0.0000001

[ADVECTION]
u0 = 62.66
m0 = 1.0

[JET_PARAMETERS]
L = 1770000
re = 6371000
A1 = 0.0075
A2 = 0.15
A3 = 0.3
c_frac1 = 0.1446
c_frac2 = 0.205
c_frac3 = 0.461

[SIMULATION]
# Mixing type: 'default' (physics-based), 'steering' (steering-based), or 'emulation' (GNN)
mixing_type = emulation
dir_out = ./out_emulation
dir_plot = ./plot_emulation
prec_warn = 1e-14
# Boundary condition method: 'periodic' or 'clip'
boundary_method = periodic
