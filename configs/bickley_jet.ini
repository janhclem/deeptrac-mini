# Bickley Jet Configuration for Stratospheric Transport
# Domain: 20000km x 10000km
# This setup models large-scale stratospheric transport with a meandering
# zonal jet flow pattern.
#
# The Bickley jet velocity field is defined by:
#   psi = -U0*L*tanh(y/L) + sum_i A_i*U0*L*sech(y/L)^2 * cos(k_i*x - sigma_i*t)
#
# This creates a meandering zonal jet with three regular vortices on each side.
# The domain is periodic in x with period 2*pi*re (planetary circumference)
# and unbounded in y (though typically y ranges roughly [-3, 3] in units of L).

[DOMAIN]
# Domain dimensions in meters
# x-domain: planetary circumference scale
lx = 2.0015086e7
# y-domain: meridional extent
ly = 2.0015086e7

[NUMERICS]
# Number of particles
nump = 20000

[TIME]
# Total simulation time in seconds (30 days)
tmax = 2592000
# Integration time step in seconds (30 minutes)
dt = 1800
# Mixing time step in seconds (24 hours)
dt_mix = 86400
# Plotting interval in seconds (same as mixing interval)
dt_plot = 86400

[PHYSICS]
# Mixing kernel shape parameter (-)
beta = 1.0
# Spatial dimensions
dim = 2

[MIXING]
# Mixing diffusivity in m^2/s 
dmix = 1.25e4
# First-order dispersion diffusivity in m^2/s
ddiff0 = 0.0
# Second-order dispersion diffusivity in m^2/s
ddiff1 = 0.0
# Critical stretching rate for steering mixing (1/s)
lbd_c = 1.39e-5
# Smoothness parameter for steering mixing tanh trigger
w = 0.0000001

[ADVECTION]
# Characteristic jet speed in m/s
u0 = 62.66
# Initial particle mass in kg
m0 = 1.0

[JET_PARAMETERS]
# Jet width scale in meters (1770 km)
L = 1770000
# Planetary radius in meters (Earth radius: 6371 km)
re = 6371000
# Amplitudes of the three meandering modes
A1 = 0.0075
A2 = 0.15
A3 = 0.3
# Phase speeds c_i / U0 for the three modes
c_frac1 = 0.1446
c_frac2 = 0.205
c_frac3 = 0.461

[SIMULATION]
# Mixing type: 'default' (physics-based), 'steering' (steering-based), or 'emulation' (GNN)
mixing_type = steering
# Flow type: 'gyre' or 'jet'
flow_type = jet
# Mass initialization type: 'gradient', 'sharp', 'gauss', 'three_gauss', 'smiley', 
# 'checkerboard', 'checkerboard_3', 'checkerboard_4', 'checkerboard_8',
# 'stripes', 'stripes_3', 'stripes_4', 'stripes_10', 'random'
init_type = gradient
# Output directory for data files
dir_out = ./data/out
# Output directory for plots
dir_plot = ./plots/plot
# Mass conservation warning threshold
prec_warn = 1e-14
# Boundary condition method: 'periodic' or 'clip'
boundary_method = periodic
