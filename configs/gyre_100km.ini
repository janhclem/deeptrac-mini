# Double-Gyre Flow Configuration
# Domain: 100km x 100km
# This is a standard mesoscale setup for studying particle dispersion
# and mixing in a double-gyre velocity field.
#
# The double-gyre velocity field creates two counter-rotating vortices
# that produce complex filamentation patterns.

[DOMAIN]
# Domain dimensions in meters
lx = 100000
ly = 100000

[NUMERICS]
# Number of particles
nump = 20000

[TIME]
# Total simulation time in seconds
tmax = 2000
# Integration time step in seconds
dt = 20
# Mixing time step in seconds
dt_mix = 2000
# Plotting interval in seconds
dt_plot = 2000

[PHYSICS]
# Mixing kernel shape parameter (-)
beta = 1.0
# Spatial dimensions
dim = 2

[MIXING]
# Mixing diffusivity in m^2/s
dmix = 62500000.0
# First-order dispersion diffusivity in m^2/s
ddiff0 = 0.0
# Second-order dispersion diffusivity in m^2/s
ddiff1 = 0.0

[ADVECTION]
# Characteristic wind speed in m/s
# If not specified or empty, computed as lx / sqrt(nump) / dt
# u0 = 
# Initial particle mass in kg
m0 = 1.0

[SIMULATION]
# Mixing type: 'default' (physics-based), 'steering' (steering-based), or 'emulation' (GNN)
mixing_type = default
# Output directory for data files
dir_out = ./out
# Output directory for plots
dir_plot = ./plot
# Mass conservation warning threshold
prec_warn = 1e-14
# Boundary condition method: 'periodic' or 'clip'
boundary_method = periodic
