# Double-Gyre Flow Configuration with Steering Mixing
# Domain: 100km x 100km
# Uses steering-based mixing scheme

[DOMAIN]
lx = 100000
ly = 100000

[NUMERICS]
nump = 20000

[TIME]
tmax = 2000
dt = 20
dt_mix = 2000
dt_plot = 2000

[PHYSICS]
beta = 1.0
dim = 2

[MIXING]
dmix = 62500000.0
ddiff0 = 0.0
ddiff1 = 0.0

[ADVECTION]
m0 = 1.0

[SIMULATION]
# Mixing type: 'default' (physics-based), 'steering' (steering-based), or 'emulation' (GNN)
mixing_type = steering
dir_out = ./out_steering
dir_plot = ./plot_steering
prec_warn = 1e-14
# Boundary condition method: 'periodic' or 'clip'
boundary_method = periodic
